CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_SERIAL_ESP32_USB=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="hacktor:~$ "
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_DISPLAY=y
CONFIG_FUEL_GAUGE=y
CONFIG_MAX17048=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LVGL=y
CONFIG_LV_Z_AUTO_INIT=n
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
CONFIG_LV_COLOR_16_SWAP=y

# Shell tools for poking at the hardware from the console.
CONFIG_DEVICE_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_KERNEL_SHELL=y

# The touch controller reports far faster than the 16-deep defaults can absorb,
# and dropped events leave LVGL with presses that never complete.
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_LV_Z_POINTER_INPUT_MSGQ_COUNT=64

# Stay in interrupt mode. The controller returns all-zero data when idle, and
# the driver reads that as a press at 0,0 (event 0 is EVENT_PRESS_DOWN), so
# polling manufactures a permanent touch. Reading only when the panel raises
# its interrupt means only real contacts are ever sampled.

